<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pharmacy Inventory{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header class="topbar">
    <div class="brand">💊 Pharmacy Inventory</div>
    <nav>
        <a href="{% url 'inventory:dashboard' %}">Dashboard</a>
        <a href="{% url 'inventory:medicine_list' %}">Medicines</a>
        <a href="{% url 'inventory:medicine_create' %}" class="nav-button">+ Add Medicine</a>
        {% if user.is_authenticated %}
            <form method="post" action="{% url 'logout' %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="nav-button">Logout</button>
            </form>
        {% endif %}
    </nav>
</header>
<main class="container">
    {% if messages %}
        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</main>
<footer>Pharmacy Inventory Management System · Django Mini Project</footer>
</body>
</html>
